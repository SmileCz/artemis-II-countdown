server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Origin "artemis-countdown" always;

  # LL2 proxy: primárně ll, při 429 fallback na lldev
  location ~ ^/api/ll2/(.*)$ {
    set $ll2_path $1;

    proxy_intercept_errors on;
    error_page 429 = @lldev;

    proxy_pass https://ll.thespacedevs.com/2.3.0/$ll2_path$is_args$args;
    proxy_http_version 1.1;

    proxy_set_header Host ll.thespacedevs.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;

    proxy_cache ll2cache;
    proxy_cache_key $scheme$proxy_host$request_uri;
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    add_header X-LL2-Cache $upstream_cache_status always;
  }

  location @lldev {
    proxy_pass https://lldev.thespacedevs.com/2.3.0/$ll2_path$is_args$args;
    proxy_http_version 1.1;

    proxy_set_header Host lldev.thespacedevs.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;

    proxy_cache ll2cache;
    proxy_cache_key $scheme$proxy_host$request_uri;
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    add_header X-LL2-Fallback "lldev" always;
    add_header X-LL2-Cache $upstream_cache_status always;
  }

  location ~ ^/api/nasa/(.*)$ {
    set $nasa_path $1;

    proxy_pass https://www.nasa.gov/$nasa_path$is_args$args;
    proxy_http_version 1.1;

    proxy_set_header Host www.nasa.gov;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;

    proxy_cache ll2cache;
    proxy_cache_key $scheme$proxy_host$request_uri;
    proxy_cache_valid 200 10m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    add_header X-NASA-Cache $upstream_cache_status always;
  }

  location /api/changes {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
