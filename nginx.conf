worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Cache pro LL2, aby se výrazně snížilo riziko HTTP 429
  proxy_cache_path /var/cache/nginx/ll2 levels=1:2 keys_zone=ll2cache:10m max_size=50m inactive=60m use_temp_path=off;

  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;

  include /etc/nginx/http.d/*.conf;
}
